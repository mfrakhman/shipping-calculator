# ─── Server ───────────────────────────────────────────────────────────────────
quarkus.http.port=5000

# ─── Database (Neon DB) ───────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${NEON_DATABASE_URL}

# ─── Hibernate ORM ────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=update

# ─── JWT (SmallRye — app-issued bearer tokens) ────────────────────────────────
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=shipping-calculator
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=86400

# ─── Google OAuth (OIDC web-app) ──────────────────────────────────────────────
quarkus.oidc.provider=google
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=${GOOGLE_CLIENT_ID}
quarkus.oidc.credentials.secret=${GOOGLE_CLIENT_SECRET}
quarkus.oidc.authentication.redirect-path=/api/auth/oauth/google/callback

# ─── RajaOngkir ───────────────────────────────────────────────────────────────
rajaongkir.api-key=${RAJAONGKIR_API_KEY}
rajaongkir.base-url=https://api.rajaongkir.com/starter

# ─── CORS ─────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# ─── Dev overrides ────────────────────────────────────────────────────────────
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
