# ─── Server ───────────────────────────────────────────────────────────────────
quarkus.http.port=5000

# ─── Database (Neon DB) ───────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${NEON_DATABASE_URL}

# ─── Hibernate ORM ────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=update

# ─── JWT (SmallRye — app-issued bearer tokens) ────────────────────────────────
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=shipping-calculator
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=86400

# ─── Google OAuth (manual implementation) ─────────────────────────────────────
quarkus.oidc.enabled=false
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=http://localhost:5000/api/auth/oauth/google/callback

# ─── Frontend ─────────────────────────────────────────────────────────────────
frontend.url=http://localhost:5173

%prod.google.redirect-uri=https://shipping.mfrakhman.web.id/api/auth/oauth/google/callback
%prod.frontend.url=https://your-app.vercel.app

# ─── Location Cache (Caffeine) ────────────────────────────────────────────────
quarkus.cache.caffeine.location-provinces.expire-after-write=168H
quarkus.cache.caffeine.location-cities.expire-after-write=168H
quarkus.cache.caffeine.location-districts.expire-after-write=168H
quarkus.cache.caffeine.location-subdistricts.expire-after-write=168H

# ─── RajaOngkir ───────────────────────────────────────────────────────────────
rajaongkir.api-key=${RAJAONGKIR_API_KEY}
rajaongkir.base-url=https://rajaongkir.komerce.id/api/v1

# ─── CORS ─────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# ─── Dev overrides ────────────────────────────────────────────────────────────
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
